name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test BikeinsideCore
        working-directory: BikeinsideCore
        run: swift test

  macos:
    name: Core tests + app build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Test BikeinsideCore
        working-directory: BikeinsideCore
        run: swift test
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Bikeinside.xcodeproj -scheme Bikeinside -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Build app (Release)
        run: |
          set -o pipefail
          xcodebuild -project Bikeinside.xcodeproj -scheme Bikeinside -configuration Release \
            -destination 'platform=macOS' -derivedDataPath build \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            build 2>&1 | tee build-release.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build-release.log
          ditto -c -k --keepParent build/Build/Products/Release/Bikeinside.app Bikeinside.zip
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Bikeinside-app
          path: Bikeinside.zip
          retention-days: 14
      - name: Screenshots
        continue-on-error: true
        timeout-minutes: 10
        run: |
          mkdir -p shots
          python3 -m venv /tmp/rt && /tmp/rt/bin/pip install -q websockets || true
          (/tmp/rt/bin/python scripts/fake_rider.py 420 > fake_rider.log 2>&1 &) || true
          BIKEINSIDE_SCREENSHOTS="$PWD/shots" build/Build/Products/Release/Bikeinside.app/Contents/MacOS/Bikeinside &
          PID=$!
          for i in $(seq 1 480); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill $PID 2>/dev/null || true
          ls -la shots
          cat fake_rider.log || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          retention-days: 14
